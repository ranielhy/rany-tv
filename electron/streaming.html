<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Rany TV</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #090b10;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }

      .toolbar {
        height: var(--toolbar-height, 72px);
        width: 100%;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        background: #10141f;
      }

      body.chrome-toolbar .toolbar {
        height: 100vh;
        border-bottom: 0;
      }

      button {
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover,
      button:focus {
        outline: 3px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.2);
      }

      .brand {
        letter-spacing: 3px;
        font-weight: 800;
      }

      .hint {
        margin-left: auto;
        color: #a8aeba;
        font-size: 14px;
      }

      #keyboard { margin-left: auto; }
      #keyboard + .hint { margin-left: 0; }
      .short-label { display: none; }

      @media (max-width: 760px) {
        .toolbar { gap: 12px; padding: 0 14px; }
        .hint { display: none; }
        button { min-height: 40px; padding: 0 14px; }
      }

      @media (max-width: 520px) {
        .brand { display: none; }
        #keyboard { margin-left: auto; }
      }

      @media (max-width: 380px) {
        .toolbar { gap: 8px; padding: 0 8px; }
        button { padding: 0 10px; font-size: 14px; }
        .long-label { display: none; }
        .short-label { display: inline; }
      }
    </style>
  </head>
  <body>
    <nav class="toolbar" aria-label="Controles da Rany TV">
      <button id="home" type="button">← <span class="long-label">Voltar para Home</span><span class="short-label">Voltar</span></button>
      <span class="brand">RANY TV</span>
      <button id="keyboard" type="button">⌨ Teclado</button>
      <span class="hint">ESC ou botão Voltar</span>
    </nav>

    <script>
      const query = new URLSearchParams(location.search);
      if (query.get("mode") === "chrome") document.body.classList.add("chrome-toolbar");
      const toolbarHeight = Number(query.get("toolbarHeight"));
      if (toolbarHeight > 0) document.documentElement.style.setProperty("--toolbar-height", `${toolbarHeight}px`);

      document.getElementById("home").addEventListener("click", () => {
        window.streamingControls.goHome();
      });
      document.getElementById("keyboard").addEventListener("click", () => {
        window.streamingControls.showKeyboard();
      });
    </script>
  </body>
</html>
